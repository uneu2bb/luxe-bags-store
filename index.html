  <title>LUXE BAGS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { 50:'#fbf8f1',100:'#f5edd8',200:'#e9d7a8',300:'#dbbc72',400:'#cfa14a',500:'#c08a33',600:'#a66d28',700:'#855223',800:'#6e4323',900:'#5c3921' },
            charcoal: '#1a1714'
          }
        }
      }
    }
  </script>
  <style>
    *{font-family:'Cairo',sans-serif}
    .font-playfair{font-family:'Playfair Display',serif}
    body{background:#0f0d0b;color:#f5f0e8}
    .glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08)}
    .gold-text{background:linear-gradient(90deg,#dbbc72,#c08a33);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .cat-card{transition:all .35s cubic-bezier(.22,1,.36,1)}
    .cat-card:hover{transform:translateY(-8px);box-shadow:0 20px 40px -10px rgba(192,138,51,.3)}
    .cat-card:hover img{transform:scale(1.08)}
    .product-card:hover{transform:translateY(-6px);box-shadow:0 25px 50px -12px rgba(192,138,51,.25)}
    .fab-menu{transition:all .3s cubic-bezier(.22,1,.36,1);transform-origin:bottom left}
  </style>
</head>

    const formatPrice = (n, cur) => cur === "TRY" ? `₺${Number(n).toLocaleString("tr-TR")}` : `${Number(n).toLocaleString("ar-SY")} ل.س`;
    const load = (k, f) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch { return f; } };
    const save = (k, d) => localStorage.setItem(k, JSON.stringify(d));

    const fileToBase64 = (file) => new Promise((resolve) => {
      if (!file) return resolve("");
      if (file.size > 2.5 * 1024 * 1024) { alert("الصورة كبيرة (الحد 2.5 ميجا)"); return resolve(""); }
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve("");
      reader.readAsDataURL(file);
    });

    const Icon = ({ d, className="w-5 h-5", stroke=1.8 }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>
    );
    const I = {

      trash:"M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16",
      settings:"M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z",
      bag:"M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z",
      arrow:"M15 19l-7-7 7-7",
      edit:"M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z",
      wa:"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z",
      phone:"M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z",
      location:"M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z M15 11a3 3 0 11-6 0 3 3 0 016 0z",
      share:"M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
    };

    function ImageUpload({ value, onChange, label = "صورة" }) {
      return (
        <div>
          <label className="text-xs text-gold-500 mb-1 block">{label}</label>
          <div className="flex gap-2 items-start">
            {value && <img src={value} className="w-12 h-12 rounded-lg object-cover border border-gold-700/40 shrink-0" alt=""/>}
            <div className="flex-1 space-y-1.5">
              <input type="file" accept="image/*" className="w-full text-xs text-gold-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-gold-500/20 file:text-gold-300"
                onChange={async (e) => {
                  const file = e.target.files?.[0];
                  if (file) { const b64 = await fileToBase64(file); if (b64) onChange(b64); }
                }}/>
              <input value={value && value.startsWith("http") ? value : ""} onChange={e => onChange(e.target.value)}
                className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-1.5 text-xs text-gold-100 outline-none focus:border-gold-500" placeholder="أو الصقي رابط"/>
            </div>
            {value && <button type="button" onClick={() => onChange("")} className="text-red-400/70 text-xs shrink-0">مسح</button>}
          </div>
        </div>
      );
    }

    function CategoryCard({ category, onOpen }) {
      return (
        <div onClick={() => onOpen(category)} className="cat-card relative rounded-2xl overflow-hidden cursor-pointer glass border border-gold-800/30 group">
          <div className="relative h-44 sm:h-52 overflow-hidden">
            <img src={category.image || "https://placehold.co/400x300/1a1714/c08a33?text=No+Image"} alt={category.title}
              className="w-full h-full object-cover transition-transform duration-500"
              onError={e => e.target.src="https://placehold.co/400x300/1a1714/c08a33?text=Image"}/>
            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"/>
            <div className="absolute bottom-0 right-0 left-0 p-3 sm:p-4">
              <h3 className="text-sm sm:text-base font-bold text-gold-100 drop-shadow">{category.title}</h3>
              <p className="text-[11px] text-gold-400/90 mt-0.5">{category.products.length} منتج</p>
            </div>
          </div>
        </div>
      );
    }

    function FloatingSocial({ settings }) {
      const [open, setOpen] = useState(false);
      const hasAny = settings.whatsapp || settings.facebook || settings.instagram;
      if (!hasAny) return null;
      const links = [];
      if (settings.whatsapp) {
        const num = settings.whatsapp.replace(/[^0-9+]/g, "");
        links.push({ label: "واتساب", href: `https://wa.me/${num}`, color: "bg-green-600", icon: I.wa });
      }
      if (settings.facebook) links.push({ label: "فيسبوك", href: settings.facebook.startsWith("http") ? settings.facebook : `https://facebook.com/${settings.facebook}`, color: "bg-blue-600", icon: I.share });
      if (settings.instagram) links.push({ label: "إنستغرام", href: settings.instagram.startsWith("http") ? settings.instagram : `https://instagram.com/${settings.instagram}`, color: "bg-pink-600", icon: I.share });

      return (
        <div className="fixed bottom-5 left-5 z-40 flex flex-col items-start gap-2">
          <div className={`fab-menu flex flex-col gap-2 ${open ? "opacity-100 translate-y-0 pointer-events-auto" : "opacity-0 translate-y-4 pointer-events-none"}`}>
            {links.map((l, i) => (
              <a key={i} href={l.href} target="_blank" rel="noopener" className={`${l.color} text-white px-4 py-2.5 rounded-full text-sm font-medium shadow-lg flex items-center gap-2 hover:scale-105 transition`}>
                <Icon d={l.icon} className="w-4 h-4"/>{l.label}
              </a>
            ))}
          </div>
          <button onClick={() => setOpen(!open)}
            className={`w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-white transition-all ${open ? "bg-gold-600 rotate-45" : "bg-gradient-to-br from-gold-400 to-gold-600"}`}>
            <Icon d={open ? I.x : I.share} className="w-6 h-6"/>
          </button>
        </div>
      );
    }

    function CartDrawer({ open, onClose, cart, currency, onUpdateQty, onRemove, onClear }) {
      const totalTRY = cart.reduce((s,i) => s + i.priceTRY * i.qty, 0);
      const totalSYP = cart.reduce((s,i) => s + i.priceSYP * i.qty, 0);
      const total = currency === "TRY" ? totalTRY : totalSYP;
      return (
        <>
          <div className={`fixed inset-0 z-40 bg-black/60 transition-opacity ${open?"opacity-100":"opacity-0 pointer-events-none"}`} onClick={onClose}/>
          <div className={`fixed top-0 left-0 h-full w-full max-w-md z-50 glass border-r border-gold-800/30 transform transition-transform duration-300 ${open?"translate-x-0":"-translate-x-full"}`}>
            <div className="flex flex-col h-full">
              <div className="flex items-center justify-between p-5 border-b border-gold-800/30">
                <h2 className="text-lg font-bold text-gold-100 flex items-center gap-2"><Icon d={I.cart} className="w-5 h-5 text-gold-400"/>سلة المشتريات</h2>
                <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center"><Icon d={I.x} className="w-4 h-4"/></button>
              </div>
              <div className="flex-1 overflow-y-auto p-4 space-y-3">
                {cart.length === 0 ? (
                  <div className="text-center py-16 text-gold-600"><Icon d={I.bag} className="w-12 h-12 mx-auto mb-3 opacity-40"/><p>السلة فارغة</p></div>
                ) : cart.map(item => (
                  <div key={item.id} className="flex gap-3 p-3 rounded-xl bg-white/5">
                    <img src={item.image} className="w-16 h-16 rounded-lg object-cover"/>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-medium text-gold-100 truncate">{item.name}</p>
                      <p className="text-xs text-gold-500 mt-0.5">{formatPrice(currency==="TRY"?item.priceTRY:item.priceSYP, currency)}</p>
                      <div className="flex items-center gap-2 mt-2">
                        <button onClick={()=>onUpdateQty(item.id,item.qty-1)} className="w-6 h-6 rounded bg-white/10 flex items-center justify-center"><Icon d={I.minus} className="w-3 h-3"/></button>
                        <span className="text-sm w-6 text-center">{item.qty}</span>
                        <button onClick={()=>onUpdateQty(item.id,item.qty+1)} className="w-6 h-6 rounded bg-white/10 flex items-center justify-center"><Icon d={I.plus} className="w-3 h-3"/></button>
                        <button onClick={()=>onRemove(item.id)} className="mr-auto text-red-400/70"><Icon d={I.trash} className="w-4 h-4"/></button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              {cart.length > 0 && (
                <div className="p-5 border-t border-gold-800/30 space-y-3">
                  <div className="flex justify-between"><span className="text-gold-400 text-sm">الإجمالي</span><span className="font-bold text-lg gold-text">{formatPrice(total,currency)}</span></div>
                  <p className="text-[11px] text-gold-700 text-left">{currency==="TRY"?formatPrice(totalSYP,"SYP"):formatPrice(totalTRY,"TRY")}</p>
                  <button className="w-full py-3.5 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm">إتمام الطلب</button>
                  <button onClick={onClear} className="w-full py-2 text-xs text-gold-600">تفريغ السلة</button>
                </div>
              )}
            </div>
          </div>
        </>
      );
    }

    function ProductModal({ product, category, currency, onClose, onAddToCart }) {
      if (!product) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md" onClick={onClose}>
          <div className="relative max-w-lg w-full glass rounded-2xl overflow-hidden shadow-2xl" onClick={e=>e.stopPropagation()}>
            <button onClick={onClose} className="absolute top-3 left-3 z-10 w-9 h-9 rounded-full bg-black/40 flex items-center justify-center text-white"><Icon d={I.x} className="w-4 h-4"/></button>
            <img src={product.image} className="w-full h-64 object-cover"/>
            <div className="p-6">
              <p className="text-xs text-gold-500 mb-1">{category?.title}</p>
              <h2 className="text-xl font-bold text-gold-100 mb-2">{product.name}</h2>
              {product.desc && <p className="text-sm text-gold-300/70 mb-4">{product.desc}</p>}
              <div className="mb-5">
                <p className="text-2xl font-bold gold-text">{formatPrice(currency==="TRY"?product.priceTRY:product.priceSYP, currency)}</p>
                <p className="text-xs text-gold-600 mt-0.5">{currency==="TRY"?formatPrice(product.priceSYP,"SYP"):formatPrice(product.priceTRY,"TRY")}</p>
              </div>
              <button onClick={()=>{onAddToCart(product);onClose();}} className="w-full py-3.5 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm flex items-center justify-center gap-2">
                <Icon d={I.cart} className="w-5 h-5"/> أضيفي إلى السلة
              </button>
            </div>
          </div>
        </div>
      );
    }

    function AdminPanel({ open, onClose, categories, setCategories, settings, setSettings }) {
      const [tab, setTab] = useState("settings");
      const [sForm, setSForm] = useState({ ...settings });
      const [form, setForm] = useState({ catId: categories[0]?.id||"", name:"", image:"", priceTRY:"", priceSYP:"", desc:"" });
      const [newCat, setNewCat] = useState({ title:"", image:"" });
      const [editCat, setEditCat] = useState(null);
      const [editProd, setEditProd] = useState(null);
      const [branchForm, setBranchForm] = useState({ name:"", address:"", phone:"" });

      useEffect(() => { if (open) setSForm({ ...settings }); }, [open, settings]);

      const persistCats = (u) => { setCategories(u); save("luxe_categories", u); };
      const persistSettings = (u) => { setSettings(u); save("luxe_settings", u); };
      const saveSettings = () => { persistSettings(sForm); alert("تم حفظ الإعدادات ✓"); };

      const addProduct = () => {
        if (!form.name || !form.priceTRY || !form.priceSYP || !form.catId) return alert("املئي الحقول المطلوبة");
        const updated = categories.map(c => c.id !== form.catId ? c : {
          ...c, products: [...c.products, {
            id: "p"+Date.now(), name: form.name, image: form.image || "https://placehold.co/400",
            priceTRY: +form.priceTRY, priceSYP: +form.priceSYP, desc: form.desc||""
          }]
        });
        persistCats(updated);
        setForm({ ...form, name:"", image:"", priceTRY:"", priceSYP:"", desc:"" });
        alert("تمت الإضافة ✓");
      };

      const addCategory = () => {
        if (!newCat.title) return alert("أدخلي اسم القسم");
        persistCats([...categories, {
          id: "cat"+Date.now(), title: newCat.title,
          image: newCat.image || "https://placehold.co/400x300/1a1714/c08a33?text=قسم",
          products: []
        }]);
        setNewCat({ title:"", image:"" });
        alert("تمت إضافة القسم ✓");
      };

      const saveEditCat = () => {
        if (!editCat?.title) return;
        persistCats(categories.map(c => c.id === editCat.id ? { ...c, title: editCat.title, image: editCat.image || c.image } : c));
        setEditCat(null); alert("تم التعديل ✓");
      };

      const saveEditProd = () => {
        if (!editProd?.name) return;
        persistCats(categories.map(c => c.id !== editProd.catId ? c : {
          ...c, products: c.products.map(p => p.id === editProd.id ? {
            ...p, name: editProd.name, image: editProd.image || p.image,
            priceTRY: +editProd.priceTRY || p.priceTRY, priceSYP: +editProd.priceSYP || p.priceSYP, desc: editProd.desc ?? p.desc
          } : p)
        }));
        setEditProd(null); alert("تم التعديل ✓");
      };

      const addBranch = () => {
        if (!branchForm.name) return;

      const [currency, setCurrency] = useState(() => load("luxe_currency", "TRY"));
      const [cartOpen, setCartOpen] = useState(false);
      const [adminOpen, setAdminOpen] = useState(false);
      const [activeCategory, setActiveCategory] = useState(null);

      useEffect(() => { save("luxe_currency", currency); }, [currency]);

      const showToast = (m) => { setToast(m); setTimeout(()=>setToast(null), 2200); };
      const addToCart = (p) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === p.id);
          if (ex) return prev.map(i => i.id === p.id ? {...i, qty: i.qty+1} : i);
          return [...prev, {...p, qty:1}];

      const removeFromCart = (id) => setCart(c => c.filter(i => i.id !== id));

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {settings.branches.map(b => (
                        <div key={b.id} className="p-4 rounded-xl glass flex gap-3">
                          <Icon d={I.location} className="w-5 h-5 text-gold-500 shrink-0 mt-0.5"/>
                          <div>
                            <p className="text-sm font-medium text-gold-100">{b.name}</p>
                            <p className="text-xs text-gold-500 mt-0.5">{b.address}</p>
                            {b.phone && <p className="text-xs text-gold-600 mt-1 flex items-center gap-1"><Icon d={I.phone} className="w-3 h-3"/>{b.phone}</p>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            ) : (
              <CategoryView category={activeCategory} currency={currency} onBack={()=>setActiveCategory(null)}
                onAddToCart={addToCart} onProductClick={p=>setSelectedProduct({product:p, category:activeCategory})}/>
            )}
          </main>

          {settings.footerDesc && (
            <footer className="border-t border-gold-900/40 mt-10 py-8 text-center px-4">
              <p className="text-gold-500 text-sm leading-relaxed max-w-lg mx-auto">{settings.footerDesc}</p>
            </footer>
          )}

          <CartDrawer open={cartOpen} onClose={()=>setCartOpen(false)} cart={cart} currency={currency}
            onUpdateQty={updateQty} onRemove={removeFromCart} onClear={clearCart}/>
          <AdminPanel open={adminOpen} onClose={()=>setAdminOpen(false)}
            categories={categories} setCategories={setCategories} settings={settings} setSettings={setSettings}/>
          {selectedProduct && (
            <ProductModal product={selectedProduct.product} category={selectedProduct.category}
              currency={currency} onClose={()=>setSelectedProduct(null)} onAddToCart={addToCart}/>
          )}
          <FloatingSocial settings={settings}/>
          {toast && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full bg-gold-500 text-charcoal text-sm font-medium shadow-lg">{toast}</div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
