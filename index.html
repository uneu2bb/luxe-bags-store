    // Compress image client-side (keeps quality, reduces size)
    
    function smartCompress(dataUrl, maxW = 1400, targetKB = 450) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
          if (h > maxW) { w = Math.round(w * maxW / h); h = maxW; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(img, 0, 0, w, h);
          let q = 0.88;
          let out = canvas.toDataURL("image/jpeg", q);
          // خفّض الجودة تدريجياً للوصول لحجم مناسب مع الحفاظ على الوضوح
          while (out.length > targetKB * 1365 && q > 0.55) {
            q -= 0.07;
            out = canvas.toDataURL("image/jpeg", q);
          }
          resolve(out);
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    function compressImage(file, maxW = 1400, quality = 0.88) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) return resolve("");
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("فشل قراءة الصورة"));
        reader.onload = () => {
          smartCompress(reader.result, maxW).then(resolve).catch(() => resolve(reader.result));
        };
        reader.readAsDataURL(file);
      });
    }

      const applyCrop = async () => {
        if (!cropSrc || !cropCb) return;
        try {
          const img = new Image();
          await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = cropSrc; });
          // منطقة القص كنسب من الصورة المعروضة مع الزوم والإزاحة
          const viewW = 100, viewH = 100;
          const scale = Math.max(viewW / img.width, viewH / img.height) * cropZoom;
          const dispW = img.width * scale;
          const dispH = img.height * scale;
          const dispX = (viewW - dispW) / 2 + (cropOff.x / 3); // تقريب إزاحة الشاشة
          const dispY = (viewH - dispH) / 2 + (cropOff.y / 3);
          // cropBox بالنسب المئوية من الحاوية
          const sx = ((cropBox.x - dispX) / scale);
          const sy = ((cropBox.y - dispY) / scale);
          const sw = cropBox.w / scale;
          const sh = cropBox.h / scale;
          const srcX = Math.max(0, Math.min(img.width, sx / 100 * img.width * (100/viewW) * (img.width/(img.width))));
          // حساب أدق بالبكسل
          const imgScale = Math.max(900 / img.width, 900 / img.height) * cropZoom;
          // نستخدم canvas وسيط نرسم فيه الصورة كما على الشاشة ثم نقص المربع
          const stage = 900;
          const sc = document.createElement("canvas");
          sc.width = stage; sc.height = stage;
          const sctx = sc.getContext("2d");
          sctx.imageSmoothingEnabled = true;
          sctx.imageSmoothingQuality = "high";
          const drawW = img.width * Math.max(stage / img.width, stage / img.height) * cropZoom;
          const drawH = img.height * Math.max(stage / img.width, stage / img.height) * cropZoom;
          const drawX = (stage - drawW) / 2 + cropOff.x * (stage/300);
          const drawY = (stage - drawH) / 2 + cropOff.y * (stage/300);
          sctx.fillStyle = "#1a1714";
          sctx.fillRect(0, 0, stage, stage);
          sctx.drawImage(img, drawX, drawY, drawW, drawH);
          const cutX = stage * cropBox.x / 100;
          const cutY = stage * cropBox.y / 100;
          const cutW = stage * cropBox.w / 100;
          const cutH = stage * cropBox.h / 100;
          const outW = Math.max(400, Math.round(cutW));
          const outH = Math.max(400, Math.round(cutH));
          const canvas = document.createElement("canvas");
          canvas.width = outW; canvas.height = outH;
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(sc, cutX, cutY, cutW, cutH, 0, 0, outW, outH);
          let q = 0.88;
          let out = canvas.toDataURL("image/jpeg", q);
          while (out.length > 450 * 1365 && q > 0.55) {
            q -= 0.07;
            out = canvas.toDataURL("image/jpeg", q);
          }
          const cb = cropCb;
          setCropSrc(null); setCropCb(null);
          if (typeof cb === "function") cb(out);
          showToast("تم قص الصورة ✓");
        } catch (e) {
          console.error(e);
          showToast("فشل قص الصورة", "err");
        }
      };

          setCropOff({x:0,y:0});
          setCropAspect("1:1");
          setCropBox({x:10,y:10,w:80,h:80});
          setCropSrc(reader.result);
          setCropCb(() => () => onDone);
        };
        reader.readAsDataURL(file);
      } catch (e) {
        showToast("خطأ في قراءة الصورة", "err");
      }
    }

                              };
                              const r = await fetch(`${SB_URL}/rest/v1/settings?id=eq.1`, {
                                method: "PATCH", headers: {...headers, "Content-Type":"application/json", "Prefer":"return=minimal"},
                                body: JSON.stringify(payload)
                              });
                              if (!r.ok) throw new Error(await r.text() || "فشل الحفظ");
                              setSettings(prev => ({...prev, ...payload}));
                              try { localStorage.removeItem("luxe_data_v1"); } catch(_){}
                              showToast("تم حفظ الحقوق ✓");
                            } catch(e) {
                              showToast(String(e.message||e).slice(0,120), "err");
                            }
                          }} className="w-full py-3 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal text-sm font-bold btn-3d">حفظ أونلاين</button>
                          <button type="button" onClick={()=>{ sessionStorage.removeItem("luxe_owner_ok"); setOwnerUnlocked(false); setOwnerPass(""); showToast("تم قفل قسم الحقوق"); }}
                            className="w-full py-2 text-xs text-gold-600">قفل القسم</button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

                    {/* Floating buttons: branches above contact */}
          <div className="fab-social flex flex-col items-start gap-3">
            {/* زر الفروع — فوق زر التواصل */}
            {branches.length > 0 && (
              <button type="button" onClick={() => { setBranchesOpen(true); setFabOpen(false); }}
                className="w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-charcoal bg-gradient-to-br from-gold-200 via-gold-400 to-gold-600 hover:scale-110 transition-all"
                style={{pointerEvents:"auto", boxShadow:"0 8px 28px rgba(192,138,51,0.35)"}}
                title="فروعنا">
                <Icon d={I.location} className="w-6 h-6"/>
              </button>
            )}
            {(settings.whatsapp||settings.facebook||settings.instagram) && (
              <>
                <div className={`fab-menu flex-col gap-2.5 transition-all duration-300 origin-bottom ${fabOpen ? "is-open opacity-100 translate-y-0 scale-100" : "opacity-0 translate-y-3 scale-95"}`}>
                  {settings.whatsapp && (
                    <a href={`https://wa.me/${String(settings.whatsapp).replace(/[^0-9+]/g,"")}`} target="_blank" rel="noopener"
                      className="group flex items-center gap-3 bg-[#0d0b09]/95 border border-green-500/30 backdrop-blur-xl pl-2 pr-4 py-2 rounded-full shadow-xl shadow-black/40 hover:border-green-400/60 hover:scale-105 transition-all">
                      <span className="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center shadow-lg shadow-green-500/30">
                        <Icon d={I.wa} className="w-5 h-5 text-white"/>
                      </span>
                      <span className="text-sm font-medium text-gold-100">واتساب</span>
                    </a>
                  )}
                  {settings.facebook && (
                    <a href={settings.facebook.startsWith("http") ? settings.facebook : `https://facebook.com/${settings.facebook}`} target="_blank" rel="noopener"
                      className="group flex items-center gap-3 bg-[#0d0b09]/95 border border-blue-500/30 backdrop-blur-xl pl-2 pr-4 py-2 rounded-full shadow-xl shadow-black/40 hover:border-blue-400/60 hover:scale-105 transition-all">
                      <span className="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                        <Icon d={I.share} className="w-5 h-5 text-white"/>
                      </span>
                      <span className="text-sm font-medium text-gold-100">فيسبوك</span>
                    </a>
                  )}
                  {settings.instagram && (
                    <a href={settings.instagram.startsWith("http") ? settings.instagram : `https://instagram.com/${settings.instagram}`} target="_blank" rel="noopener"
                      className="group flex items-center gap-3 bg-[#0d0b09]/95 border border-pink-500/30 backdrop-blur-xl pl-2 pr-4 py-2 rounded-full shadow-xl shadow-black/40 hover:border-pink-400/60 hover:scale-105 transition-all">
                      <span className="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 flex items-center justify-center shadow-lg shadow-pink-500/30">
                        <Icon d={I.share} className="w-5 h-5 text-white"/>
                      </span>
                      <span className="text-sm font-medium text-gold-100">إنستغرام</span>
                    </a>
                  )}
                </div>
                <button type="button" onClick={() => setFabOpen(!fabOpen)}
                  className={`relative w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-charcoal transition-all duration-300 ${fabOpen ? "bg-gold-200 rotate-45 scale-95" : "bg-gradient-to-br from-gold-300 via-gold-500 to-gold-700 hover:scale-110"}`}
                  style={{pointerEvents:"auto", boxShadow: fabOpen ? "0 8px 32px rgba(0,0,0,0.4)" : "0 8px 32px rgba(192,138,51,0.45)"}}>
                  <Icon d={fabOpen ? I.x : I.share} className="w-6 h-6"/>
                  {!fabOpen && <span className="absolute inset-0 rounded-full bg-gold-400/40 animate-ping opacity-40" style={{animationDuration:"2.5s"}}/>}
                </button>
              </>
            )}
          </div>

          {/* نافذة الفروع الفخمة */}
          {branchesOpen && (
            <div className="fixed inset-0 z-[10000] flex items-end sm:items-center justify-center p-4 bg-black/70 backdrop-blur-sm" onClick={()=>setBranchesOpen(false)}>
              <div className="w-full max-w-md rounded-3xl border border-gold-700/40 bg-[#14110e] shadow-2xl overflow-hidden" onClick={e=>e.stopPropagation()}>
                <div className="flex items-center justify-between p-5 border-b border-gold-800/40 bg-gradient-to-l from-[#1a1714] to-[#1f1a14]">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-700 flex items-center justify-center">
                      <Icon d={I.location} className="w-5 h-5 text-charcoal"/>
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-gold-100">فروعنا</h3>
                      <p className="text-[10px] text-gold-600">{branches.length} فرع</p>
                    </div>
                  </div>
                  <button type="button" onClick={()=>setBranchesOpen(false)} className="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-gold-400">
                    <Icon d={I.x}/>
                  </button>
                </div>
                <div className="p-4 space-y-3 max-h-[60vh] overflow-y-auto">
                  {branches.map(b=>(
                    <div key={b.id} className="p-4 rounded-2xl bg-white/[0.04] border border-gold-800/30 flex gap-3">
                      <div className="w-10 h-10 rounded-full bg-gold-500/15 flex items-center justify-center shrink-0">
                        <Icon d={I.location} className="w-5 h-5 text-gold-400"/>
                      </div>
                      <div className="min-w-0">
                        <p className="text-sm font-bold text-gold-100">{b.name}</p>
                        {b.address && <p className="text-xs text-gold-500 mt-0.5">{b.address}</p>}
                        {b.phone && (
                          <a href={`tel:${b.phone}`} className="inline-flex items-center gap-1 text-xs text-gold-400 mt-2 hover:text-gold-300">
                            <Icon d={I.phone} className="w-3.5 h-3.5"/> {b.phone}
                          </a>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          
          {/* نافذة قص الصورة الحر */}
          {cropSrc && (
            <div className="fixed inset-0 z-[10050] flex items-center justify-center p-3 bg-black/90 backdrop-blur-sm">
              <div className="w-full max-w-md rounded-3xl border border-gold-700/40 bg-[#14110e] shadow-2xl overflow-hidden max-h-[95vh] flex flex-col">
                <div className="flex items-center justify-between p-4 border-b border-gold-800/40 shrink-0">
                  <div>
                    <h3 className="text-sm font-bold text-gold-100">قص الصورة</h3>
                    <p className="text-[10px] text-gold-600">اختاري المقاس، قرّبي، وحرّكي الإطار</p>
                  </div>
                  <button type="button" onClick={()=>{setCropSrc(null);setCropCb(null);}} className="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-gold-400"><Icon d={I.x}/></button>
                </div>

                {/* نسب القص */}
                <div className="flex gap-1.5 px-4 pt-3 shrink-0 overflow-x-auto">
                  {[
                    {id:"1:1", label:"مربع"},
                    {id:"3:4", label:"عمودي"},
                    {id:"4:3", label:"أفقي"},
                    {id:"free", label:"حر"},
                  ].map(a => (
                    <button key={a.id} type="button" onClick={()=>setAspect(a.id)}
                      className={`px-3 py-1.5 rounded-full text-[11px] font-medium whitespace-nowrap border transition ${cropAspect===a.id ? "bg-gold-500/20 border-gold-500 text-gold-200" : "bg-white/5 border-gold-800/40 text-gold-600"}`}>
                      {a.label}
                    </button>
                  ))}
                </div>

                {/* منطقة القص */}
                <div className="relative mx-4 mt-3 aspect-square rounded-2xl overflow-hidden border border-gold-700/30 bg-black shrink-0"
                  id="crop-stage">
                  <img
                    src={cropSrc}
                    alt=""
                    draggable={false}
                    className="absolute select-none pointer-events-none"
                    style={{
                      width: `${100 * cropZoom}%`,
                      height: `${100 * cropZoom}%`,
                      left: `calc(50% + ${cropOff.x}px)`,
                      top: `calc(50% + ${cropOff.y}px)`,
                      transform: "translate(-50%, -50%)",
                      maxWidth: "none",
                      objectFit: "cover"
                    }}
                  />
                  {/* طبقة تعتيم خارج إطار القص */}
                  <div className="absolute inset-0 pointer-events-none" style={{
                    background: `linear-gradient(#000a,#000a) 0 0 / 100% ${cropBox.y}% no-repeat,
                                 linear-gradient(#000a,#000a) 0 ${cropBox.y+cropBox.h}% / 100% ${100-cropBox.y-cropBox.h}% no-repeat,
                                 linear-gradient(#000a,#000a) 0 ${cropBox.y}% / ${cropBox.x}% ${cropBox.h}% no-repeat,
                                 linear-gradient(#000a,#000a) ${cropBox.x+cropBox.w}% ${cropBox.y}% / ${100-cropBox.x-cropBox.w}% ${cropBox.h}% no-repeat`
                  }}/>
                  {/* إطار القص القابل للسحب */}
                  <div
                    className="absolute border-2 border-gold-400 rounded-lg shadow-[0_0_0_1px_rgba(192,138,51,0.3)]"
                    style={{
                      left: `${cropBox.x}%`, top: `${cropBox.y}%`,
                      width: `${cropBox.w}%`, height: `${cropBox.h}%`,
                      touchAction: "none", cursor: "move"
                    }}
                    onPointerDown={(e)=>{
                      e.preventDefault();
                      e.currentTarget.setPointerCapture(e.pointerId);
                      const parent = e.currentTarget.parentElement.getBoundingClientRect();
                      const sx = e.clientX, sy = e.clientY;
                      const ox = cropBox.x, oy = cropBox.y;
                      const move = (ev) => {
                        const dx = ((ev.clientX - sx) / parent.width) * 100;
                        const dy = ((ev.clientY - sy) / parent.height) * 100;
                        setCropBox(b => ({
                          ...b,
                          x: Math.max(0, Math.min(100 - b.w, ox + dx)),
                          y: Math.max(0, Math.min(100 - b.h, oy + dy))
                        }));
                      };
                      const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
                      window.addEventListener("pointermove", move);
                      window.addEventListener("pointerup", up);
                    }}
                  >
                    {/* زوايا للتحجيم */}
                    {["nw","ne","sw","se"].map(corner => (
                      <div key={corner}
                        className="absolute w-4 h-4 bg-gold-400 rounded-sm border border-charcoal"
                        style={{
                          left: corner.includes("w") ? -6 : "auto",
                          right: corner.includes("e") ? -6 : "auto",
                          top: corner.includes("n") ? -6 : "auto",
                          bottom: corner.includes("s") ? -6 : "auto",
                          cursor: corner==="nw"||corner==="se" ? "nwse-resize" : "nesw-resize",
                          touchAction: "none"
                        }}
                        onPointerDown={(e)=>{
                          e.preventDefault();
                          e.stopPropagation();
                          e.currentTarget.setPointerCapture(e.pointerId);
                          const parent = e.currentTarget.parentElement.parentElement.getBoundingClientRect();
                          const sx = e.clientX, sy = e.clientY;
                          const ob = {...cropBox};
                          const move = (ev) => {
                            const dx = ((ev.clientX - sx) / parent.width) * 100;
                            const dy = ((ev.clientY - sy) / parent.height) * 100;
                            setCropBox(() => {
                              let {x,y,w,h} = {...ob};
                              if (corner.includes("e")) w = Math.max(20, Math.min(100 - x, ob.w + dx));
                              if (corner.includes("s")) h = Math.max(20, Math.min(100 - y, ob.h + dy));
                              if (corner.includes("w")) {
                                const nw = Math.max(20, ob.w - dx);
                                const nx = ob.x + (ob.w - nw);
                                if (nx >= 0) { x = nx; w = nw; }
                              }
                              if (corner.includes("n")) {
                                const nh = Math.max(20, ob.h - dy);
                                const ny = ob.y + (ob.h - nh);
                                if (ny >= 0) { y = ny; h = nh; }
                              }
                              if (cropAspect === "1:1") {
                                const s = Math.min(w, h);
                                w = s; h = s;
                              } else if (cropAspect === "3:4") {
                                h = w * 4/3; if (y+h>100) h=100-y; w = h * 3/4;
                              } else if (cropAspect === "4:3") {
                                w = h * 4/3; if (x+w>100) w=100-x; h = w * 3/4;
                              }
                              return {x,y,w,h};
                            });
                          };
                          const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
                          window.addEventListener("pointermove", move);
                          window.addEventListener("pointerup", up);
                        }}
                      />
                    ))}
                    {/* خطوط الشبكة */}
                    <div className="absolute inset-0 pointer-events-none opacity-30">
                      <div className="absolute left-1/3 top-0 bottom-0 w-px bg-gold-300/50"/>
                      <div className="absolute left-2/3 top-0 bottom-0 w-px bg-gold-300/50"/>
                      <div className="absolute top-1/3 left-0 right-0 h-px bg-gold-300/50"/>
                      <div className="absolute top-2/3 left-0 right-0 h-px bg-gold-300/50"/>
                    </div>
                  </div>
                </div>

                <div className="p-4 space-y-3 shrink-0">
                  <div className="flex items-center gap-3">
                    <span className="text-[11px] text-gold-600 w-12">تصغير</span>
                    <input type="range" min="1" max="3" step="0.05" value={cropZoom}
                      onChange={e=>setCropZoom(+e.target.value)}
                      className="flex-1 accent-amber-500"/>
                    <span className="text-[11px] text-gold-600 w-12 text-left">تكبير</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-[11px] text-gold-600 w-12">تحريك</span>
                    <input type="range" min="-80" max="80" step="1" value={cropOff.x}
                      onChange={e=>setCropOff(o=>({...o,x:+e.target.value}))}
                      className="flex-1 accent-amber-500"/>
                    <span className="text-[11px] text-gold-600 w-12 text-left">أفقي</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-[11px] text-gold-600 w-12">تحريك</span>
                    <input type="range" min="-80" max="80" step="1" value={cropOff.y}
                      onChange={e=>setCropOff(o=>({...o,y:+e.target.value}))}
                      className="flex-1 accent-amber-500"/>
                    <span className="text-[11px] text-gold-600 w-12 text-left">عمودي</span>
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={()=>{setCropZoom(1);setCropOff({x:0,y:0});setAspect(cropAspect);}}
                      className="px-3 py-2.5 rounded-xl bg-white/5 text-gold-500 text-xs">إعادة</button>
                    <button type="button" onClick={applyCrop}
                      className="flex-1 py-2.5 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal text-sm font-bold btn-3d">
                      قص وحفظ
                    </button>
                  </div>
                  <p className="text-[10px] text-gold-700 text-center">اسحبي الإطار أو زواياه للقص كما تريدين — مع ضغط ذكي للجودة</p>
                </div>
              </div>
            </div>
          )}


          
                  

          {deleteConfirm && (
            <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-sm rounded-2xl border border-gold-700/40 bg-[#1a1714] p-6 shadow-2xl space-y-4">
                <div className="text-center">
                  <div className="w-14 h-14 mx-auto mb-3 rounded-full bg-red-500/15 flex items-center justify-center">
                    <Icon d={I.trash} className="w-6 h-6 text-red-400"/>
                  </div>
                  <h3 className="text-lg font-bold text-gold-100 mb-1">تأكيد الحذف</h3>
                  <p className="text-sm text-gold-500">هل تريد حذف «{deleteConfirm.name}»؟</p>
                  <p className="text-xs text-gold-700 mt-1">لا يمكن التراجع عن هذا الإجراء</p>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>setDeleteConfirm(null)} className="flex-1 py-3 rounded-xl bg-white/5 text-gold-400 text-sm font-medium">إلغاء</button>
                  <button onClick={async()=>{
                    try {
                      if(deleteConfirm.type==="product") await sbDelete("products", deleteConfirm.id);
                      else await sbDelete("categories", deleteConfirm.id);
                      setDeleteConfirm(null);
                      await loadData();
                      showToast("تم الحذف ✓");
                    } catch(e){ showToast(String(e.message||e), "err"); }
                  }} className="flex-1 py-3 rounded-xl bg-red-600 text-white text-sm font-bold">حذف</button>
                </div>
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-28 left-1/2 -translate-x-1/2 z-[10001] px-5 py-3 rounded-2xl shadow-2xl text-sm font-medium border backdrop-blur-xl"
              style={{background: toast.type==="err" ? "rgba(127,29,29,0.95)" : "linear-gradient(135deg,#c08a33,#dbbc72)", color: toast.type==="err" ? "#fecaca" : "#1a1714", borderColor: toast.type==="err" ? "rgba(248,113,113,0.3)" : "rgba(192,138,51,0.4)"}}>
              {toast.msg || toast}
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
