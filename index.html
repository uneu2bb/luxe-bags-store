    // Upload image to Supabase Storage or fallback to base64
    async function uploadImage(file) {
      if (!file) return "";
      if (file.size > 3 * 1024 * 1024) { alert("الصورة كبيرة (الحد 3 ميجا)"); return ""; }
      if (supabase) {
        try {
          const ext = file.name.split(".").pop() || "jpg";
          const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
          const { error } = await supabase.storage.from("images").upload(path, file, { upsert: true });
          if (error) throw error;
          const { data } = supabase.storage.from("images").getPublicUrl(path);
          return data.publicUrl;
        } catch (e) {
          console.warn("Storage upload failed, using base64", e);
        }
      }
      // fallback base64
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve("");
        reader.readAsDataURL(file);
      });
    }

      useEffect(() => { if (open) { setSForm({ ...settings }); setUnlocked(false); setAdminPass(""); } }, [open, settings]);

      const checkPass = () => {
        if (adminPass === (settings.admin_password || "admin123")) setUnlocked(true);

      if (!unlocked) {
        return (

                <p className="text-xs text-gold-600 mt-1">أدخل كلمة السر</p>

              <input type="password" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkPass()}

            </div>
          </div>
        );
      }

      const saveSettings = async () => {
        setSaving(true);
        try {
          if (supabase) {
            const { error } = await supabase.from("settings").upsert({ id: 1, ...sForm, updated_at: new Date().toISOString() });
            if (error) throw error;
          }
          setSettings(sForm);
          alert("تم حفظ الإعدادات أونلاين ✓");
        } catch(e) { alert("خطأ: " + e.message); }
        setSaving(false);
      };

    // ===================== APP =====================
    function App() {
      const [ready, setReady] = useState(false);
      const [needSetup, setNeedSetup] = useState(!supabase);
      const [categories, setCategories] = useState([]);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [branches, setBranches] = useState([]);
      const [cart, setCart] = useState(() => { try { return JSON.parse(localStorage.getItem("luxe_cart")||"[]"); } catch { return []; } });
      const [currency, setCurrency] = useState(() => localStorage.getItem("luxe_currency") || "TRY");
      const [cartOpen, setCartOpen] = useState(false);
      const [adminOpen, setAdminOpen] = useState(false);
      const [activeCategory, setActiveCategory] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(true);

      const loadData = async () => {
        if (!supabase) { setLoading(false); return; }
        try {
          const [sRes, cRes, pRes, bRes] = await Promise.all([
            supabase.from("settings").select("*").eq("id", 1).maybeSingle(),
            supabase.from("categories").select("*").order("sort_order"),
            supabase.from("products").select("*").order("sort_order"),
            supabase.from("branches").select("*").order("created_at")
          ]);
          if (sRes.data) setSettings({ ...DEFAULT_SETTINGS, ...sRes.data });
          const cats = (cRes.data || []).map(c => ({
            ...c,
            products: (pRes.data || []).filter(p => p.category_id === c.id)
          }));
          setCategories(cats);
          setBranches(bRes.data || []);
        } catch (e) {
          console.error(e);
          alert("خطأ في تحميل البيانات: " + e.message);
        }
        setLoading(false);
      };

      useEffect(() => {
        if (supabase) loadData();
        else setLoading(false);
      }, []);

      useEffect(() => { localStorage.setItem("luxe_cart", JSON.stringify(cart)); }, [cart]);
      useEffect(() => { localStorage.setItem("luxe_currency", currency); }, [currency]);

      if (needSetup && !supabase) return <SetupScreen onConfigured={() => setNeedSetup(false)} />;

      const showToast = (m) => { setToast(m); setTimeout(()=>setToast(null), 2200); };
      const addToCart = (p) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === p.id);
          if (ex) return prev.map(i => i.id === p.id ? {...i, qty: i.qty+1} : i);
          return [...prev, {...p, qty:1, price_try: p.price_try ?? p.priceTRY, price_syp: p.price_syp ?? p.priceSYP}];
        });
        showToast("تمت الإضافة ✓");
      };
      const updateQty = (id, qty) => { if (qty < 1) return setCart(c => c.filter(i => i.id !== id)); setCart(c => c.map(i => i.id === id ? {...i, qty} : i)); };
      const removeFromCart = (id) => setCart(c => c.filter(i => i.id !== id));
      const clearCart = () => setCart([]);
      const cartCount = cart.reduce((s,i) => s + i.qty, 0);

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#0f0d0b]">
            <div className="text-center">
              <div className="w-10 h-10 border-2 border-gold-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
              <p className="text-gold-500 text-sm">جاري التحميل...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#0f0d0b] pb-20">
          <header className="sticky top-0 z-30 border-b border-gold-900/40 bg-[#0f0d0b]/90 backdrop-blur-xl">
            <div className="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                {settings.logo ? (
                  <img src={settings.logo} className="w-10 h-10 rounded-full object-cover border border-gold-600/40" alt="logo"/>
                ) : (
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-gold-400 to-gold-700 flex items-center justify-center">
                    <Icon d={I.bag} className="w-5 h-5 text-charcoal"/>
                  </div>
                )}
                <div>
                  <h1 className="text-base sm:text-lg font-bold font-playfair gold-text tracking-wide">{settings.site_name || "LUXE BAGS"}</h1>
                  {settings.tagline && <p className="text-[10px] text-gold-600 -mt-0.5">{settings.tagline}</p>}
                </div>
              </div>
              <div className="flex items-center gap-1.5 sm:gap-2">
                <div className="flex rounded-full bg-white/5 border border-gold-800/40 p-0.5 text-[11px] sm:text-xs">
                  <button onClick={()=>setCurrency("TRY")} className={`px-2.5 sm:px-3 py-1.5 rounded-full transition ${currency==="TRY"?"bg-gold-500 text-charcoal font-bold":"text-gold-500"}`}>₺</button>
                  <button onClick={()=>setCurrency("SYP")} className={`px-2.5 sm:px-3 py-1.5 rounded-full transition ${currency==="SYP"?"bg-gold-500 text-charcoal font-bold":"text-gold-500"}`}>ل.س</button>
                </div>
                <button onClick={()=>setAdminOpen(true)} className="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-gold-500"><Icon d={I.settings} className="w-5 h-5"/></button>
                <button onClick={()=>setCartOpen(true)} className="relative w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-gold-400">
                  <Icon d={I.cart} className="w-5 h-5"/>
                  {cartCount > 0 && <span className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-gold-500 text-charcoal text-[10px] font-bold flex items-center justify-center">{cartCount}</span>}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8">
            {!activeCategory ? (
              <>
                <div className="text-center mb-10">
                  <p className="text-gold-500 text-sm tracking-widest mb-2">مجموعة 2026</p>
                  <h2 className="text-2xl sm:text-3xl md:text-4xl font-bold font-playfair text-gold-100 mb-3">اكتشفي أناقتك</h2>
                  {settings.header_desc && <p className="text-gold-600 text-sm max-w-md mx-auto leading-relaxed">{settings.header_desc}</p>}
                </div>
                <div className="grid grid-cols-2 gap-3 sm:gap-5">
                  {categories.map(cat => <CategoryCard key={cat.id} category={cat} onOpen={setActiveCategory}/>)}
                </div>
                {branches.length > 0 && (
                  <div className="mt-12">
                    <h3 className="text-lg font-bold text-gold-200 mb-4 text-center">فروعنا</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {branches.map(b => (
                        <div key={b.id} className="p-4 rounded-xl glass flex gap-3">
                          <Icon d={I.location} className="w-5 h-5 text-gold-500 shrink-0 mt-0.5"/>
                          <div>
                            <p className="text-sm font-medium text-gold-100">{b.name}</p>
                            <p className="text-xs text-gold-500 mt-0.5">{b.address}</p>
                            {b.phone && <p className="text-xs text-gold-600 mt-1 flex items-center gap-1"><Icon d={I.phone} className="w-3 h-3"/>{b.phone}</p>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            ) : (
              <CategoryView category={activeCategory} currency={currency} onBack={()=>setActiveCategory(null)}
                onAddToCart={addToCart} onProductClick={p=>setSelectedProduct({product:p, category:activeCategory})}/>
            )}
          </main>

          {settings.footer_desc && (
            <footer className="border-t border-gold-900/40 mt-10 py-8 text-center px-4">
              <p className="text-gold-500 text-sm leading-relaxed max-w-lg mx-auto">{settings.footer_desc}</p>
            </footer>
          )}

          <CartDrawer open={cartOpen} onClose={()=>setCartOpen(false)} cart={cart} currency={currency}
            onUpdateQty={updateQty} onRemove={removeFromCart} onClear={clearCart}/>
          <AdminPanel open={adminOpen} onClose={()=>setAdminOpen(false)}
            categories={categories} setCategories={setCategories}
            settings={settings} setSettings={setSettings}
            branches={branches} setBranches={setBranches}
            reload={loadData}/>
          {selectedProduct && (
            <ProductModal product={selectedProduct.product} category={selectedProduct.category}
              currency={currency} onClose={()=>setSelectedProduct(null)} onAddToCart={addToCart}/>
          )}
          <FloatingSocial settings={settings}/>
          {toast && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full bg-gold-500 text-charcoal text-sm font-medium shadow-lg">{toast}</div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
