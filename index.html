    // Compress image client-side (keeps quality, reduces size)
    function compressImage(file, maxW = 1200, quality = 0.82) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) return resolve("");
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("فشل قراءة الصورة"));
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error("فشل تحميل الصورة"));
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleImageFile(file, onDone) {

      if (file.size > 8 * 1024 * 1024) { alert("الصورة كبيرة جداً (الحد 8 ميجا)"); return; }
      try {
        const compressed = await compressImage(file, 1200, 0.82);
        if (compressed) onDone(compressed);

                  {cart.length>0 && (
                    <div className="p-5 border-t border-gold-800/30 space-y-3">
                      <div className="flex justify-between"><span className="text-gold-400 text-sm">الإجمالي</span><span className="font-bold gold-text">{formatPrice(currency==="TRY"?totalTRY:totalSYP,currency)}</span></div>
                      <button onClick={checkoutWhatsApp} className="w-full py-3.5 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm shadow-lg shadow-gold-500/20 active:scale-[0.98] transition">إتمام الطلب عبر واتساب</button>
                      <button onClick={()=>setCart([])} className="w-full py-2 text-xs text-gold-600">تفريغ</button>
                    </div>
                  )}
                </div>
              </div>
            </>
          )}

          {/* Product modal */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70" onClick={()=>setSelectedProduct(null)}>
              <div className="relative max-w-lg w-full glass rounded-2xl overflow-hidden" onClick={e=>e.stopPropagation()}>
                <button onClick={()=>setSelectedProduct(null)} className="absolute top-3 left-3 z-10 w-9 h-9 rounded-full bg-black/40 flex items-center justify-center text-white"><Icon d={I.x}/></button>
                <img src={selectedProduct.image} className="w-full h-64 object-cover"/>
                <div className="p-6">
                  <h2 className="text-xl font-bold text-gold-100 mb-2">{selectedProduct.name}</h2>
                  {selectedProduct.description && <p className="text-sm text-gold-300/70 mb-4">{selectedProduct.description}</p>}
                  <p className="text-2xl font-bold gold-text mb-1">{formatPrice(currency==="TRY"?selectedProduct.price_try:selectedProduct.price_syp,currency)}</p>
                  <p className="text-xs text-gold-600 mb-5">{currency==="TRY"?formatPrice(selectedProduct.price_syp,"SYP"):formatPrice(selectedProduct.price_try,"TRY")}</p>
                  <button onClick={()=>{addToCart(selectedProduct);setSelectedProduct(null);}} className="w-full py-3.5 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm flex items-center justify-center gap-2">
                    <Icon d={I.cart}/> أضيفي إلى السلة
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Admin */}
          {adminOpen && !unlocked && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/85">
              <div className="w-full max-w-sm glass rounded-2xl p-6 space-y-4">
                <div className="text-center">
                  <Icon d={I.lock} className="w-10 h-10 text-gold-500 mx-auto mb-2"/>
                  <h2 className="text-lg font-bold text-gold-100">لوحة التحكم</h2>
                </div>
                <input type="password" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(adminPass===(settings.admin_password||"admin123")?setUnlocked(true):alert("خطأ"))}
                  className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none text-center" placeholder="كلمة السر"/>
                <button onClick={()=>adminPass===(settings.admin_password||"admin123")?setUnlocked(true):alert("خطأ")} className="w-full py-3 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm">دخول</button>
                <button onClick={()=>setAdminOpen(false)} className="w-full py-2 text-xs text-gold-600">إلغاء</button>
              </div>
            </div>
          )}

          {adminOpen && unlocked && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/85">
              <div className="w-full max-w-2xl max-h-[93vh] overflow-y-auto glass rounded-2xl border border-gold-700/30">
                <div className="sticky top-0 z-10 flex items-center justify-between p-4 border-b border-gold-800/40 bg-[#1a1714]/95">
                  <h2 className="text-base font-bold text-gold-100">لوحة التحكم • أونلاين</h2>
                  <button onClick={()=>setAdminOpen(false)}><Icon d={I.x}/></button>
                </div>
                <div className="flex overflow-x-auto border-b border-gold-800/30">
                  {["settings","products","categories","branches","social"].map(t=>(
                    <button key={t} onClick={()=>setTab(t)} className={`px-3 py-2.5 text-xs whitespace-nowrap ${tab===t?"text-gold-300 border-b-2 border-gold-500":"text-gold-600"}`}>
                      {{settings:"الإعدادات",products:"منتجات",categories:"أقسام",branches:"فروع",social:"تواصل"}[t]}
                    </button>
                  ))}
                </div>
                <div className="p-4 space-y-4">
                  {tab==="settings" && (
                    <>
                      <input value={sForm.site_name||""} onChange={e=>setSForm({...sForm,site_name:e.target.value})} placeholder="اسم المتجر" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <input value={sForm.tagline||""} onChange={e=>setSForm({...sForm,tagline:e.target.value})} placeholder="الشعار" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <div className="space-y-1.5">
                        <label className="text-xs text-gold-500">اللوجو (رفع من الجهاز)</label>
                        <input type="file" accept="image/*" className="w-full text-xs text-gold-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-gold-500/20 file:text-gold-300"
                          onChange={async (e)=>{ const f=e.target.files?.[0]; if(f) await handleImageFile(f, (url)=>setSForm({...sForm, logo:url})); }}/>
                        {sForm.logo && <img src={sForm.logo} className="w-14 h-14 rounded-full object-cover border border-gold-600/40" alt=""/>}
                        <input value={sForm.logo && sForm.logo.startsWith("http") ? sForm.logo : ""} onChange={e=>setSForm({...sForm,logo:e.target.value})} placeholder="أو رابط اللوجو" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      </div>
                      <textarea value={sForm.header_desc||""} onChange={e=>setSForm({...sForm,header_desc:e.target.value})} placeholder="وصف أعلى" rows={2} className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none resize-none"/>
                      <textarea value={sForm.footer_desc||""} onChange={e=>setSForm({...sForm,footer_desc:e.target.value})} placeholder="وصف أسفل" rows={2} className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none resize-none"/>
                      <input value={sForm.admin_password||""} onChange={e=>setSForm({...sForm,admin_password:e.target.value})} placeholder="كلمة السر" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <button disabled={saving} onClick={async()=>{
                        setSaving(true);
                        try {
                          await fetch(`${SB_URL}/rest/v1/settings?id=eq.1`,{method:"PATCH",headers,body:JSON.stringify({...sForm,updated_at:new Date().toISOString()})});
                          setSettings({...settings,...sForm});
                          alert("تم الحفظ ✓");
                        } catch(e){alert(e.message)}
                        setSaving(false);
                      }} className="w-full py-3 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm">حفظ أونلاين</button>
                    </>
                  )}
                  {tab==="products" && (
                    <>
                      <select value={form.category_id} onChange={e=>setForm({...form,category_id:e.target.value})} className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100">
                        <option value="">اختر قسم</option>
                        {categories.map(c=><option key={c.id} value={c.id} className="bg-charcoal">{c.title}</option>)}
                      </select>
                      <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="اسم المنتج" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <div className="space-y-1.5">
                        <label className="text-xs text-gold-500">صورة المنتج (رفع من الجهاز — تُضغط تلقائياً)</label>
                        <input type="file" accept="image/*" className="w-full text-xs text-gold-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-gold-500/20 file:text-gold-300"
                          onChange={async (e)=>{ const f=e.target.files?.[0]; if(f) await handleImageFile(f, (url)=>setForm({...form, image:url})); }}/>
                        {form.image && <img src={form.image} className="w-16 h-16 rounded-lg object-cover border border-gold-700/40" alt=""/>}
                        <input value={form.image && form.image.startsWith("http") ? form.image : ""} onChange={e=>setForm({...form,image:e.target.value})} placeholder="أو الصقي رابط صورة" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <input type="number" value={form.price_try} onChange={e=>setForm({...form,price_try:e.target.value})} placeholder="سعر ₺" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                        <input type="number" value={form.price_syp} onChange={e=>setForm({...form,price_syp:e.target.value})} placeholder="سعر ل.س" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      </div>
                      <button disabled={saving} onClick={async()=>{
                        if(!form.name||!form.category_id) return alert("املئي الحقول");
                        setSaving(true);
                        try {
                          await sbPost("products",{category_id:form.category_id,name:form.name,image:form.image||"",price_try:+form.price_try||0,price_syp:+form.price_syp||0,description:form.description||""});
                          await loadData();
                          setForm({category_id:form.category_id,name:"",image:"",price_try:"",price_syp:"",description:""});
                          alert("تمت الإضافة ✓");
                        } catch(e){alert(e.message)}
                        setSaving(false);
                      }} className="w-full py-3 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm">إضافة منتج</button>
                    </>
                  )}
                  {tab==="categories" && (
                    <>
                      <input value={newCat.title} onChange={e=>setNewCat({...newCat,title:e.target.value})} placeholder="اسم القسم" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <div className="space-y-1.5">
                        <label className="text-xs text-gold-500">صورة القسم (رفع — ضغط تلقائي)</label>
                        <input type="file" accept="image/*" className="w-full text-xs text-gold-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-gold-500/20 file:text-gold-300"
                          onChange={async (e)=>{ const f=e.target.files?.[0]; if(f) await handleImageFile(f, (url)=>setNewCat({...newCat, image:url})); }}/>
                        {newCat.image && <img src={newCat.image} className="w-16 h-16 rounded-lg object-cover border border-gold-700/40" alt=""/>}
                        <input value={newCat.image && newCat.image.startsWith("http") ? newCat.image : ""} onChange={e=>setNewCat({...newCat,image:e.target.value})} placeholder="أو رابط صورة" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      </div>
                      <button onClick={async()=>{
                        if(!newCat.title) return;
                        await sbPost("categories",{title:newCat.title,image:newCat.image||""});
                        setNewCat({title:"",image:""});
                        await loadData();
                        alert("تمت الإضافة ✓");
                      }} className="w-full py-3 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm">إضافة قسم</button>
                      {categories.map(c=>(
                        <div key={c.id} className="flex items-center gap-3 p-3 rounded-xl bg-white/5">
                          <img src={c.image} className="w-12 h-12 rounded-lg object-cover"/>
                          <div className="flex-1"><p className="text-sm text-gold-100">{c.title}</p><p className="text-[11px] text-gold-600">{(c.products||[]).length} منتج</p></div>
                          <button onClick={async()=>{if(confirm("حذف؟")){await sbDelete("categories",c.id);await loadData();}}} className="text-red-400/70"><Icon d={I.trash} className="w-4 h-4"/></button>
                        </div>
                      ))}
                    </>
                  )}
                  {tab==="branches" && (
                    <>
                      <input value={branchForm.name} onChange={e=>setBranchForm({...branchForm,name:e.target.value})} placeholder="اسم الفرع" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <input value={branchForm.address} onChange={e=>setBranchForm({...branchForm,address:e.target.value})} placeholder="العنوان" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <input value={branchForm.phone} onChange={e=>setBranchForm({...branchForm,phone:e.target.value})} placeholder="الهاتف" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <button onClick={async()=>{
                        if(!branchForm.name) return;
                        await sbPost("branches",branchForm);
                        setBranchForm({name:"",address:"",phone:""});
                        await loadData();
                      }} className="w-full py-2.5 rounded-xl bg-gold-500/20 text-gold-300 text-sm">إضافة فرع</button>
                      {branches.map(b=>(
                        <div key={b.id} className="flex gap-3 p-3 rounded-xl bg-white/5">
                          <div className="flex-1"><p className="text-sm text-gold-100">{b.name}</p><p className="text-xs text-gold-500">{b.address}</p></div>
                          <button onClick={async()=>{await sbDelete("branches",b.id);await loadData();}} className="text-red-400/70"><Icon d={I.trash} className="w-4 h-4"/></button>
                        </div>
                      ))}
                    </>
                  )}
                  {tab==="social" && (
                    <>
                      <input value={sForm.whatsapp||""} onChange={e=>setSForm({...sForm,whatsapp:e.target.value})} placeholder="واتساب 90555..." className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <input value={sForm.facebook||""} onChange={e=>setSForm({...sForm,facebook:e.target.value})} placeholder="فيسبوك" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <input value={sForm.instagram||""} onChange={e=>setSForm({...sForm,instagram:e.target.value})} placeholder="إنستغرام" className="w-full bg-white/5 border border-gold-800/40 rounded-lg px-3 py-2.5 text-sm text-gold-100 outline-none"/>
                      <button onClick={async()=>{
                        await fetch(`${SB_URL}/rest/v1/settings?id=eq.1`,{method:"PATCH",headers,body:JSON.stringify({whatsapp:sForm.whatsapp,facebook:sForm.facebook,instagram:sForm.instagram})});
                        setSettings({...settings,...sForm});
                        alert("تم ✓");
                      }} className="w-full py-3 rounded-xl bg-gradient-to-l from-gold-500 to-gold-600 text-charcoal font-bold text-sm">حفظ</button>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}

                    {/* Floating social menu - luxury */}
          {(settings.whatsapp||settings.facebook||settings.instagram) && (
            <div
              className="fixed z-40 flex flex-col items-start gap-3"
              style={{ left: "12px", right: "auto", bottom: "24px" }}
            >
              <div className={`flex flex-col gap-2.5 transition-all duration-300 origin-bottom ${fabOpen ? "opacity-100 translate-y-0 scale-100 pointer-events-auto" : "opacity-0 translate-y-3 scale-95 pointer-events-none"}`}>
                {settings.whatsapp && (
                  <a href={`https://wa.me/${String(settings.whatsapp).replace(/[^0-9+]/g,"")}`} target="_blank" rel="noopener"
                    className="group flex items-center gap-3 bg-[#0d0b09]/95 border border-green-500/30 backdrop-blur-xl pl-2 pr-4 py-2 rounded-full shadow-xl shadow-black/40 hover:border-green-400/60 hover:scale-105 transition-all">
                    <span className="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center shadow-lg shadow-green-500/30">
                      <Icon d={I.wa} className="w-5 h-5 text-white"/>
                    </span>
                    <span className="text-sm font-medium text-gold-100">واتساب</span>
                  </a>
                )}
                {settings.facebook && (
                  <a href={settings.facebook.startsWith("http") ? settings.facebook : `https://facebook.com/${settings.facebook}`} target="_blank" rel="noopener"
                    className="group flex items-center gap-3 bg-[#0d0b09]/95 border border-blue-500/30 backdrop-blur-xl pl-2 pr-4 py-2 rounded-full shadow-xl shadow-black/40 hover:border-blue-400/60 hover:scale-105 transition-all">
                    <span className="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                      <Icon d={I.share} className="w-5 h-5 text-white"/>
                    </span>
                    <span className="text-sm font-medium text-gold-100">فيسبوك</span>
                  </a>
                )}
                {settings.instagram && (
                  <a href={settings.instagram.startsWith("http") ? settings.instagram : `https://instagram.com/${settings.instagram}`} target="_blank" rel="noopener"
                    className="group flex items-center gap-3 bg-[#0d0b09]/95 border border-pink-500/30 backdrop-blur-xl pl-2 pr-4 py-2 rounded-full shadow-xl shadow-black/40 hover:border-pink-400/60 hover:scale-105 transition-all">
                    <span className="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 flex items-center justify-center shadow-lg shadow-pink-500/30">
                      <Icon d={I.share} className="w-5 h-5 text-white"/>
                    </span>
                    <span className="text-sm font-medium text-gold-100">إنستغرام</span>
                  </a>
                )}
              </div>
              <button onClick={() => setFabOpen(!fabOpen)}
                className={`relative w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-charcoal transition-all duration-300 ${fabOpen ? "bg-gold-200 rotate-45 scale-95" : "bg-gradient-to-br from-gold-300 via-gold-500 to-gold-700 hover:scale-110"}`}
                style={{boxShadow: fabOpen ? "0 8px 32px rgba(0,0,0,0.4)" : "0 8px 32px rgba(192,138,51,0.45)"}}>
                <Icon d={fabOpen ? I.x : I.share} className="w-6 h-6"/>
                {!fabOpen && <span className="absolute inset-0 rounded-full bg-gold-400/40 animate-ping opacity-40" style={{animationDuration:"2.5s"}}/>}
              </button>
            </div>
          )}

          {toast && <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full bg-gold-500 text-charcoal text-sm font-medium">{toast}</div>}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
